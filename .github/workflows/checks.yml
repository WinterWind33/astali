# Checks every pull request and every push: formatting, types, lints, tests, on each platform.
# Written in the development repo and synced to the public one. In the public repo it runs on every platform; in the
# development repo only on Linux, on every push, so a branch is checked before it's merged. No secrets: pull requests
# from forks run it with a read-only token.
name: Checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # In the development repo the push already checks a pull request's branch.
    if: github.repository == 'WinterWind33/astali' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.repository == 'WinterWind33/astali' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # A slow Ubuntu mirror once hung this step for 10+ minutes; fail fast instead.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev

      - run: npm ci

      - name: Formatting
        if: runner.os == 'Linux'
        run: npm run format:check

      - name: Dependency audit
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high

      # Type-checks and builds the frontend, which the Rust build embeds.
      - run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test
